defaults:
  branch: main
  upstreamRemote: upstream
  institutionRemote: origin
  license: Apache-2.0
  contributionPolicy: upstream-first
governance:
  organizationDefaultPermission: none
  memberRepositoryCreation: false
  memberPagesCreation: false
  protectedMainPushActors:
    - RedjiJB
  clubMembersTeamPermission: triage
  maintainersTeamPermission: maintain
  pullRequestRequired: true
  approvingReviewsRequired: 0
  approvingReviewsTarget: 1
  dismissStaleReviews: true
  requireConversationResolution: true
  enforceForAdministrators: true
  allowForcePushes: false
  allowBranchDeletion: false
  deleteMergedBranches: true
  commonHistoryPolicy: linear
  institutionHistoryPolicy: upstream-merge-commits-allowed
  requiredStatusChecks: deferred-until-self-hosted-ci-implementation
  webCommitSignoffRequired: true
  secretScanning: enabled
  secretScanningPushProtection: enabled
  dependencyVulnerabilityAlerts: enabled
  automatedSecurityFixes: enabled
  privateVulnerabilityReporting: enabled
  repositoryWikis: disabled
  twoFactorRequirement: enabled-and-verified
